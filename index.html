<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HHF Arbiter v3.1</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; max-width: 800px; margin: auto; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        #results { margin-top: 20px; padding: 15px; border: 1px solid #ccc; display: none; }
        .red-zone { background: #ffebeb; border-left: 5px solid red; }
        .ghost-rule { background: #f0f4ff; border-left: 5px solid blue; }
        .procedural { background: #fffdf0; border-left: 5px solid orange; }
    </style>
</head>
<body>
    <h1>HHF Arbiter v3.1</h1>
    <p>Type your situation below (e.g., "I wore navy scrubs" or "My Lead gave me a write-up"):</p>
    
    <textarea id="userInput" placeholder="What happened at the clinic today?"></textarea>
    <button onclick="runAudit()">Check Situation</button>

    <div id="results">
        <h2 id="statusHeader"></h2>
        <p id="verdictText"></p>
        <p><strong>Recommended Action:</strong> <span id="actionText"></span></p>
        <hr>
        <small><em>Disclaimer: HHF is an at-will employer [cite: 1210-1213]. Use this info professionally to seek clinical clarification, not to start an argument [cite: 132-133, 953-954].</em></small>
    </div>

    <script src="data.js"></script>
    <script src="logic.js"></script>
    <script>
        function runAudit() {
            const text = document.getElementById('userInput').value;
            const result = auditSituation(text); // This calls the brain in logic.js
            
            const box = document.getElementById('results');
            box.style.display = "block";
            box.className = result.status.toLowerCase().replace(" ", "-");
            
            document.getElementById('statusHeader').innerText = result.status;
            document.getElementById('verdictText').innerText = result.verdict;
            document.getElementById('actionText').innerText = result.script || result.action;
        }
    </script>
</body>
</html>
