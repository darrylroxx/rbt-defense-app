<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1c1115">
    <title>The Handbook Checker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>
    <div class="hdr">
        <div class="hdr-inner">
            <h1>The Handbook Checker</h1>
            <p>Fair Arbiter Edition: Logic-based handbook analysis.</p>
        </div>
    </div>

    <div class="mn">
        <div class="inp-wrap" id="iw">
            <div class="inp-inner">
                <textarea class="inp-ta" id="mi" placeholder="Describe the situation... (e.g., 'I was on my phone using a timer and my BCBA wrote me up.')"></textarea>
                <button class="btn-def" id="db">Check My Situation</button>
                <div class="handbook-link-wrap">
                    <a class="handbook-link" href="./hhf-handbook-2025-2027.pdf" target="_blank">Open HHF Handbook PDF</a>
                </div>
            </div>
        </div>

        <div class="loading" id="ld">
            <div class="spinner"></div>
            <p style="color: #aaa; margin-top: 10px; font-size: 14px;">Analyzing context...</p>
        </div>

        <div id="rs"></div>

        <div id="fs" class="hide">
            <button class="btn-clr" id="ca">Start New Search</button>
        </div>
    </div>

    <div id="ios-prompt" class="ios-banner hide">
        <div class="ios-banner-content">
            <span>Install as an app: Tap <strong>Share</strong> then <strong>'Add to Home Screen'</strong></span>
            <button onclick="document.getElementById('ios-prompt').remove()">✕</button>
        </div>
    </div>

    <div class="st">v2.6 - Fair Arbiter + iOS Smart Banner</div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
